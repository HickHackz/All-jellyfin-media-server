---
version: "3.3"
services:
  soulseek:
    image: realies/soulseek
    network_mode: service:gluetun
    container_name: soulseek
    depends_on:
      - gluetun
    restart: unless-stopped
    volumes:
      - /persistent/appdata:/data/.SoulseekQt
      - /persistent/downloads:/data/Soulseek Downloads
      - /persistent/logs:/data/Soulseek Chat Logs
      - /persistent/shared:/data/Soulseek Shared Folder
    environment:
      - PGID=1000
      - PUID=1000
  gluetun:
    container_name: gluetun
    image: qmcgaw/gluetun
    cap_add: [ NET_ADMIN ]
    restart: unless-stopped
    # expose qBittorrent WebUI (adjust if you use a different WebUI port)
    ports:
      - "8088:8088"   # qBittorrent WebUI through VPN
      # (Do NOT publish your torrent listen port here; Proton's port is inbound via the tunnel.)
    environment:
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=wireguard
      # ---- From your Proton WG config ----
      - WIREGUARD_PRIVATE_KEY=${WG_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WG_ADDRESS}        # e.g. 10.2.3.4/32
      - VPN_ENDPOINT_IP=${WG_ENDPOINT_IP}        # or set VPN_ENDPOINT_HOSTNAME
      - VPN_ENDPOINT_PORT=${WG_ENDPOINT_PORT}    # usually 51820
      - FIREWALL_INPUT_PORTS=8088        # <-- allow WebUI inbound
      - FIREWALL_OUTBOUND_SUBNETS=10.0.0.0/24
      - WIREGUARD_PUBLIC_KEY=${WG_PUBLIC_KEY}
      # ------------------------------------
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_PROVIDER=protonvpn
      - VPN_PORT_FORWARDING_STATUS_FILE=/gluetun/forwarded_port
      # Automatically update qBittorrent's listening port when Proton assigns/changes it
      - UPDATER_PERIOD=24h
      - TZ=${TZ}
    volumes:
      - ${COMMON_PATH}/gluetun:/gluetun

  qb-port-watcher:
    image: alpine:3.20
    container_name: qb-port-watcher
    # share the network namespace with gluetun/qbittorrent
    network_mode: service:gluetun
    depends_on:
      - gluetun
      - qbittorrent
    environment:
      - QBT_HOST=127.0.0.1
      - QBT_PORT=8088
      - QBT_USER=admin
      - QBT_PASS=adminadmin
      - PORT_FILE=/gluetun/forwarded_port
      - CHECK_EVERY=5s
    volumes:
      - ${COMMON_PATH}/gluetun:/gluetun:ro
      - ${COMMON_PATH}/scripts/qb-port-watcher.sh:/app/watch.sh:ro
    # install tools then run
    entrypoint: ["/bin/sh","-c","apk add --no-cache curl inotify-tools bash >/dev/null && /app/watch.sh"]
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    network_mode: service:gluetun
    container_name: qbittorrent
    depends_on:
          - gluetun
    environment:
      - WEBUI_PORT=8088
      - QB_WEBUI_USERNAME=admin
      - QB_WEBUI_PASSWORD=adminadmin
      - PUID=0
      - PGID=0
      - TZ=${TZ}
      #- DOCKER_MODS=ghcr.io/gabe565/linuxserver-mod-vuetorrent
    volumes:
      - ${COMMON_PATH}:${COMMON_PATH}
      - ${COMMON_PATH}/configs/qbittorrent:/config
    restart: unless-stopped
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=${TZ}
      #- LANG=fr_FR
      #- LANG=en_US
    ports:
      - 8191:8191
    restart: unless-stopped
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    volumes:
      - ${COMMON_PATH}/configs/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped
  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    volumes:
      - ${COMMON_PATH}/configs/jackett:/config
    ports:
      - 9117:9117
    restart: unless-stopped
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    volumes:
      - ${COMMON_PATH}:${COMMON_PATH}
      - ${COMMON_PATH}/configs/sonarr:/config
    ports:
      - 3456:3456
    restart: unless-stopped
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    volumes:
      - ${COMMON_PATH}:${COMMON_PATH}
      - ${COMMON_PATH}/configs/radarr:/config
    ports:
      - 7878:7878
    restart: unless-stopped
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    volumes:
      - ${COMMON_PATH}:${COMMON_PATH}
      - ${COMMON_PATH}/configs/lidarr:/config
    ports:
      - 8686:8686
    restart: unless-stopped

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
      - NVIDIA_VISIBLE_DEVICES=all
    ports:
      - 8096:8096
      - 8920:8920
      - 7359:7359/udp
      - 1900:1900/udp
    volumes:
      - ${COMMON_PATH}:${COMMON_PATH}
      - ${COMMON_PATH}/configs/jellyfin:/config
      - ${COMMON_PATH}/jellyfin/cache:/cache
    deploy:
       resources:
         reservations:
           devices:
             - driver: nvidia
               count: 1
               capabilities:
                 - gpu
    restart: unless-stopped
  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      - LOG_LEVEL=debug
      - TZ=${TZ}
    ports:
      - 5055:5055
    volumes:
      - ${COMMON_PATH}/configs/jellyseerr:/app/config
    restart: unless-stopped
